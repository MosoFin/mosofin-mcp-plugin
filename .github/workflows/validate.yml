name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.290
      - name: Validate manifests and components
        # marketplace.json carries `domains` for the xAI marketplace; Claude
        # Code warns on it, so that file does not run --strict.
        run: |
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate .claude-plugin/marketplace.json
          claude plugin validate skills --strict
          claude plugin validate agents --strict
